<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>TerminalTable / TerminalTransferList demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!--
  Zero-build demo: Tailwind Play CDN (JIT, config below mirrors the
  "midnight" palette this package's components are styled against — see
  alethic-ism-ui-enterprise/tailwind.config.js, the canonical source) +
  browser import maps resolving the library's peer deps to CDN ESM builds,
  so `../../dist/index.js` (the actual built artifact, not source) runs
  unmodified, the way a real host consumes the package.
-->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          'ibm-plex': ['IBM Plex Mono', 'monospace'],
        },
        colors: {
          midnight: {
            base: '#0e0e10', surface: '#161618', elevated: '#1e1e22', raised: '#28282e',
            border: '#333338', 'border-subtle': '#404048', 'border-glow': '#505058',
            'text-primary': '#ffffff', 'text-secondary': '#e8e8ec', 'text-body': '#c8c8d0',
            'text-muted': '#9898a0', 'text-subdued': '#707078', 'text-disabled': '#585860',
            'text-hint': '#484850', 'text-label': '#a0a0b0',
            danger: '#ef4444', 'danger-bright': '#f87171', 'danger-glow': '#fca5a5',
            warning: '#f59e0b', 'warning-bright': '#fbbf24',
            success: '#10b981', 'success-bright': '#34d399', 'success-glow': '#6ee7b7',
            info: '#3b82f6', 'info-bright': '#60a5fa', 'info-glow': '#93c5fd',
            accent: '#8b5cf6', 'accent-bright': '#a78bfa', 'accent-glow': '#c4b5fd',
            glow: '#7c3aed', shimmer: '#a855f7', electric: '#06b6d4',
          },
        },
        boxShadow: {
          'midnight-glow': '0 0 20px rgba(96, 165, 250, 0.2)',
          'midnight-glow-sm': '0 0 10px rgba(96, 165, 250, 0.15)',
        },
      },
    },
  };
</script>

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react/jsx-runtime": "https://esm.sh/react@19.0.0/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@19.0.0?deps=react@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client?deps=react@19.0.0",
    "lucide-react": "https://esm.sh/lucide-react@0.563.0?deps=react@19.0.0",
    "@headlessui/react": "https://esm.sh/@headlessui/react@2.2.9?deps=react@19.0.0,react-dom@19.0.0",
    "@heroicons/react/24/solid": "https://esm.sh/@heroicons/react@2.2.0/24/solid?deps=react@19.0.0",
    "@heroicons/react/24/outline": "https://esm.sh/@heroicons/react@2.2.0/24/outline?deps=react@19.0.0"
  }
}
</script>
</head>
<body class="bg-midnight-base text-midnight-text-body font-ibm-plex min-h-screen">
  <div id="root" class="p-6"></div>
  <script type="module" src="./demo.js"></script>
</body>
</html>

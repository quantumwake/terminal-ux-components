<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AppHeader</title>
<style>
  @font-face {
    font-family: "IBM Plex Sans";
    src: url("../../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff") format("woff");
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: "IBM Plex Sans";
    src: url("../../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-500-normal.woff") format("woff");
    font-weight: 500;
    font-style: normal;
  }
  @font-face {
    font-family: "IBM Plex Sans";
    src: url("../../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff") format("woff");
    font-weight: 600;
    font-style: normal;
  }
  html, body { margin: 0; background: #141210; }
  header {
    position: relative;
    width: 1440px;
    height: 72px;
    background: #141210;
    font-family: "IBM Plex Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #ece6df;
  }
  .logo {
    position: absolute;
    left: 28px;
    top: 22px;
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: #e8743b;
    color: #0f0e0d;
    font-weight: 600;
    font-size: 14px;
    line-height: 28px;
    text-align: center;
  }
  .product {
    position: absolute;
    left: 69px;
    top: 0;
    height: 72px;
    display: flex;
    align-items: center;
    font-weight: 600;
    font-size: 17px;
  }
  .org {
    position: absolute;
    left: 186px;
    top: 20px;
    width: 135px;
    height: 33px;
    box-sizing: border-box;
    border: 1px solid #2a2622;
    border-radius: 8px;
    background: #1c1a17;
    color: #c9c0b6;
    font-size: 14px;
    font-weight: 400;
    display: flex;
    align-items: center;
    padding: 0 12px 0 11px;
    justify-content: space-between;
  }
  .nav {
    position: absolute;
    left: 631px;
    top: 14px;
    width: 346px;
    height: 44px;
    box-sizing: border-box;
    border: 1px solid #2a2622;
    border-radius: 10px;
    background: #1c1a17;
  }
  .nav .pill {
    position: absolute;
    left: 157px;
    top: 4px;
    width: 72px;
    height: 34px;
    border-radius: 8px;
    background: #2b2520;
  }
  .nav span {
    position: absolute;
    top: 0;
    height: 42px;
    display: flex;
    align-items: center;
    font-size: 14px;
    font-weight: 500;
    color: #a39a90;
  }
  .nav .home { left: 18px; }
  .nav .projects { left: 83px; }
  .nav .on { left: 170px; color: #ece6df; }
  .nav .organization { left: 247px; }
  .action {
    position: absolute;
    left: 1287px;
    top: 17px;
    width: 125px;
    height: 38px;
    border-radius: 8px;
    background: #e8743b;
    color: #0f0e0d;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
</style>
</head>
<body>
<header>
  <div class="logo">A</div>
  <div class="product">Agent Studio</div>
  <div class="org">Quantum Wake <svg width="10" height="6" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="#a39a90" stroke-width="1.2" stroke-linecap="round"/></svg></div>
  <div class="nav" role="tablist" aria-label="Sections">
    <div class="pill" aria-hidden="true"></div>
    <span class="home" role="tab">Home</span>
    <span class="projects" role="tab">Projects</span>
    <span class="on" role="tab" aria-selected="true">Agents</span>
    <span class="organization" role="tab">Organization</span>
  </div>
  <div class="action">+ New agent</div>
</header>
</body>
</html>

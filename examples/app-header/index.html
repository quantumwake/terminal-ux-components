<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AppHeader</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #0f0e0d; }
  button { font: inherit; }
</style>
</head>
<body>
<!--
  The header from docs/design/mockups/app-v2/source/Agents.dc.html.
  The pixel gate clips this page to the top 72px of 8-Agents.png.
-->
<div style="min-height: 960px; background: #0f0e0d; color: #ece6df; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column">
<header style="display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 14px 28px; border-bottom: 1px solid #2a2622; background: #141210; flex-wrap: wrap">
<div style="display: flex; align-items: center; gap: 14px">
<div style="width: 28px; height: 28px; border-radius: 6px; background: #e8743b; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: #160d07; font-size: 14px">A</div>
<span style="font-weight: 600; font-size: 17px">Agent Studio</span>
<button type="button" style="display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 8px; border: 1px solid #2a2622; background: #1c1a17; color: #ece6df; font-size: 13px; cursor: pointer">Quantum Wake<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
</div>
<nav aria-label="Sections" style="display: flex; gap: 4px; background: #1c1a17; border: 1px solid #2a2622; border-radius: 8px; padding: 4px">
<span style="padding: 8px 14px; border-radius: 6px; color: #a39a90; font-size: 14px">Home</span>
<span style="padding: 8px 14px; border-radius: 6px; color: #a39a90; font-size: 14px">Projects</span>
<span style="padding: 8px 14px; border-radius: 6px; background: #2b2520; color: #ece6df; font-size: 14px">Agents</span>
<span style="padding: 8px 14px; border-radius: 6px; color: #a39a90; font-size: 14px">Organization</span>
</nav>
<button type="button" style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 8px; border: none; background: #e8743b; color: #160d07; font-weight: 600; font-size: 14px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New agent</button>
</header>
</div>
</body>
</html>

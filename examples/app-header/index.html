<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AppHeader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #0f0e0d; }
</style>
</head>
<body>
<!--
  Story for AppHeader and SegmentedNav. Colours are the studio tokens
  (src/theme/studio.ts). The React components are the ones a host renders;
  this page is the same header so it can be opened with no build.
-->
<header style="display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 16px;background:#141210;border-bottom:1px solid #2a2622;font-family:'IBM Plex Sans',sans-serif;color:#ece6df;">
  <div style="display:flex;align-items:center;gap:10px;">
    <span style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;background:#e8743b;color:#0f0e0d;font-weight:650;">A</span>
    <span style="font-weight:600;font-size:14px;">Agent Studio</span>
    <span style="border:1px solid #2a2622;border-radius:8px;padding:4px 10px;color:#c9c0b6;font-size:13px;">Quantum Wake</span>
  </div>
  <div style="display:inline-flex;gap:2px;padding:3px;background:#0f0e0d;border:1px solid #2a2622;border-radius:10px;">
    <span style="padding:6px 14px;border-radius:8px;background:#1a1714;color:#ece6df;font-size:13px;">Home</span>
    <span style="padding:6px 14px;color:#a39a90;font-size:13px;">Projects</span>
    <span style="padding:6px 14px;color:#a39a90;font-size:13px;">Agents</span>
    <span style="padding:6px 14px;color:#a39a90;font-size:13px;">Organization</span>
  </div>
  <div style="display:flex;align-items:center;gap:8px;font-size:13px;">
    <span style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:#9fd39b;color:#0f0e0d;font-size:11px;font-weight:650;">K</span>
    <span>Kasra <span style="color:#a39a90;">· Owner</span></span>
  </div>
</header>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ChannelRail</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#0f0e0d}button{font:inherit}</style>
</head>
<body>
<div style="min-height: 960px; background: #0f0e0d; color: #ece6df; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column">
<header style="display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 14px 28px; border-bottom: 1px solid #2a2622; background: #141210">
<div style="display: flex; align-items: center; gap: 14px">
<div style="width: 28px; height: 28px; border-radius: 6px; background: #e8743b; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: #160d07; font-size: 14px">A</div>
<span style="font-weight: 600; font-size: 17px">Agent Studio</span>
<button type="button" style="display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 8px; border: 1px solid #2a2622; background: #1c1a17; color: #ece6df; font-size: 13px">Quantum Wake</button>
</div>
<nav style="display: flex; gap: 4px; background: #1c1a17; border: 1px solid #2a2622; border-radius: 8px; padding: 4px">
<span style="padding: 8px 14px; border-radius: 6px; color: #a39a90; font-size: 14px">Home</span>
<span style="padding: 8px 14px; border-radius: 6px; background: #2b2520; color: #ece6df; font-size: 14px">Projects</span>
<span style="padding: 8px 14px; border-radius: 6px; color: #a39a90; font-size: 14px">Agents</span>
<span style="padding: 8px 14px; border-radius: 6px; color: #a39a90; font-size: 14px">Organization</span>
</nav>
<span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: #a39a90"><span style="width: 28px; height: 28px; border-radius: 50%; background: #9fd39b; color: #0d1a0c; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600">KR</span>Kasra · Owner</span>
</header>
<div style="padding: 18px 28px 0; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px">
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 24px; font-weight: 600">Studio</span><span style="font-size: 13px; color: #a39a90">3 people · 6 agents · 2 channels</span></span>
<nav style="display: flex; gap: 4px; background: #1c1a17; border: 1px solid #2a2622; border-radius: 8px; padding: 4px">
<span style="padding: 7px 12px; border-radius: 6px; color: #a39a90; font-size: 13px">Board</span>
<span style="padding: 7px 12px; border-radius: 6px; background: #2b2520; color: #ece6df; font-size: 13px">Channel</span>
<span style="padding: 7px 12px; border-radius: 6px; color: #a39a90; font-size: 13px">People and agents</span>
<span style="padding: 7px 12px; border-radius: 6px; color: #a39a90; font-size: 13px">Settings</span>
</nav>
</div>
<div style="display: flex; flex-grow: 1; min-height: 0; margin-top: 16px; border-top: 1px solid #2a2622">
<div id="channels" style="display: contents"></div>
</div>
</div>
<script src="./story.js"></script>
</body>
</html>
